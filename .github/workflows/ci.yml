name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('com.lyrion.lms.sdPlugin/manifest.json','utf8')); console.log('manifest.json OK')"
      - name: Syntax check app.js
        run: node --check com.lyrion.lms.sdPlugin/app.js
      - name: Run smoke tests
        run: node --test test/smoke.test.js
